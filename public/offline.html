<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل بالإنترنت | نظام توثيق الطلبات</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #F7F9FC;
      color: #182230;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E4E7EC;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #FEF3F2;
      color: #C62828;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      font-size: 1.5rem;
      font-weight: bold;
    }
    h1 {
      font-size: 1.25rem;
      color: #0B2646;
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #667085;
      line-height: 1.5;
      margin: 0 0 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #0B2646;
      color: #FFFFFF;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>أنت غير متصل بالإنترنت حالياً</h1>
    <p>
      يتطلب حفظ الطلبات وتوثيق الصور الاتصال بشبكة الإنترنت للتزامن الفوري. يرجى التحقق من اتصال شبكة Wi-Fi أو بيانات الهاتف وإعادة المحاولة.
    </p>
    <button class="btn" onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
